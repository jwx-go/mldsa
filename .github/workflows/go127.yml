name: Go 1.27
on:
  pull_request:
    branches:
      - develop/v*
  push:
    branches:
      - develop/v*

# Go 1.27 ships crypto/mldsa and encoding/json/v2, so GOEXPERIMENT stays unset
# here. Naming an experiment the toolchain already ships rebuilds the standard
# library under a non-default configuration for no benefit.
#
# jwx implements ML-DSA natively from v4.4.0 on, which go.mod now requires, and
# its ML-DSA files are //go:build go1.27. The toolchain therefore selects the
# mode on its own: Go 1.26 leaves this package owning the algorithms, and
# Go 1.27 puts it in interop mode behind jwx. No jwx upgrade step is needed
# here any more, and there is no supported configuration in which Go 1.27 runs
# standalone, so that job is gone.
#
# Go 1.26 standalone coverage lives in ci.yml, which builds from go.mod.
#
# JWX_MLDSA_EXPECT_INTEROP makes TestInteropModeMatchesExpectation fail if the
# run landed in the other mode. Without it a misconfigured job would go green
# having skipped everything the job exists to cover.

jobs:
  interop:
    runs-on: ubuntu-latest
    name: "Test (interop)"
    env:
      JWX_MLDSA_EXPECT_INTEROP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go127-interop-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go127-interop-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Test
        run: go test -v -race ./...
